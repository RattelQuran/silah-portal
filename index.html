<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>بوابة صلة</title>
<link rel="icon" href="logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* SILAH Signature (direction D): cream paper and the gold thread of the site (A), a navy-deep
   administrative frame (B), and calm restraint (C). One token set; every role shares the same parts. */
:root{
  color-scheme:light;
  /* identity */
  --navy-deep:#0C2470; --navy:#1236A0; --crimson:#C8174D; --gold:#C9A24B; --gold-ink:#8A6A1F;
  /* ground */
  --paper:#FBF7F0; --sand:#F4EDE1; --sheet:#FFFFFF; --sky:#E9EEF9; --line:#E8DFCF; --line-2:#D9CDB6;
  --ink:#14213D; --muted:#5E6678; --on:#FFFFFF;
  /* attendance status (approved, unchanged) */
  --ok:#1F8F6A; --late:#B87F00; --miss:#C8174D; --exc:#64748F; --tab:#1236A0; --res:#7A5AA8; --warn:#B87F00;
  /* type */
  --fh:"Baloo Bhaijaan 2","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  /* shape */
  --r-sm:10px; --r:14px; --r-lg:20px; --arch:22px 22px 14px 14px;
  --shadow:0 1px 0 rgba(201,162,75,.16),0 6px 18px rgba(12,36,112,.05);
  --shadow-lift:0 1px 0 rgba(201,162,75,.2),0 14px 30px rgba(12,36,112,.09);
  --thread:linear-gradient(90deg,transparent,var(--gold) 18%,var(--gold) 82%,transparent);
  /* type scale (1.125 steps around a 15.5px body) */
  --t-xs:.75rem; --t-sm:.84rem; --t-md:.92rem; --t-base:1rem; --t-lg:1.1rem; --t-xl:1.3rem; --t-2xl:1.6rem; --t-num:1.75rem;
  /* spacing: 4px grid */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f);font-size:15.5px;line-height:1.6;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--crimson);outline-offset:2px;border-radius:8px}
a{color:var(--navy)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ic{width:1.15em;height:1.15em;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em}

/* ---------- shell: navy frame, gold thread, cream tabs ---------- */
.top{position:sticky;top:0;z-index:5;background:var(--paper)}
.top>.wrap:first-child{display:flex;align-items:center;gap:12px;padding-block:10px}
.top .brandbar{background:var(--navy-deep);color:#fff;position:relative}
.top .brandbar::after{content:"";position:absolute;inset-inline:0;bottom:0;height:2px;background:var(--thread);opacity:.9}
.logo{display:inline-flex;align-items:center;gap:10px;text-decoration:none}
.logo img{width:38px;height:38px;object-fit:cover;object-position:50% 30%;border-radius:50%;background:#fff;box-shadow:0 0 0 2px var(--gold)}
.logo b{color:#fff;font-family:var(--fh);font-weight:800;font-size:1.25rem;line-height:1}
.logo small{display:block;color:#C9D3F0;font-size:.76rem;font-weight:500;line-height:1.3}
.me{margin-inline-start:auto;display:flex;align-items:center;gap:10px;font-size:.86rem;color:#C9D3F0}
.me b{color:#fff}
.me .btn.ghost{background:transparent;color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35)}
.tabsbar{border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--paper) 94%,transparent);backdrop-filter:blur(8px)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;display:inline-flex;align-items:center;gap:7px;border:0;background:none;padding:12px 14px 13px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;position:relative;font-size:.92rem}
.tabs button .ic{order:-1;opacity:.75}
.tabs button:hover{color:var(--navy-deep)}
.tabs button[aria-selected="true"]{color:var(--navy-deep);font-weight:700}
.tabs button[aria-selected="true"] .ic{opacity:1;color:var(--crimson)}
.tabs button[aria-selected="true"]::after{content:"";position:absolute;inset-inline:12px;bottom:-1px;height:2.5px;border-radius:2px;background:var(--crimson)}
.tabs .cnt{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--crimson);color:#fff;font-size:.72rem;font-weight:700}
.demo{background:var(--gold);color:var(--navy-deep);text-align:center;font-size:.82rem;font-weight:700;padding:4px 12px}

main{padding-block:20px 80px}
h1,h2,h3{color:var(--navy-deep);margin:0;line-height:1.3;text-wrap:balance;font-family:var(--fh)}
h1{font-size:var(--t-2xl);font-weight:800}
h2{font-size:var(--t-lg);font-weight:700;display:flex;align-items:center;gap:var(--s2)}
h2 .ic{color:var(--gold-ink)}
h3{font-size:var(--t-base);font-weight:700}
.eyebrow{display:flex;align-items:center;gap:8px;color:var(--gold-ink);font-size:.8rem;font-weight:600;letter-spacing:0}
.eyebrow::before{content:"";width:18px;height:2px;border-radius:2px;background:var(--gold)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s2) var(--s3);margin-bottom:var(--s4)}
.bar .grow{flex:1;min-width:0}
.nav{display:flex;align-items:center;gap:4px;background:var(--sheet);border-radius:999px;padding:3px;border:1px solid var(--line)}
.nav button{border:0;background:none;width:36px;height:36px;border-radius:50%;cursor:pointer;color:var(--navy-deep);display:grid;place-items:center}
.nav button:hover{background:var(--sand)}
.nav span{min-width:150px;text-align:center;font-weight:700;font-size:.92rem;font-variant-numeric:tabular-nums}

/* ---------- buttons (one family, four intents) ---------- */
.btn{border:0;border-radius:12px;padding:9px 16px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-size:.9rem;line-height:1.3;transition:background-color .15s,box-shadow .15s}
.btn.red{background:var(--crimson);color:var(--on)}
.btn.red:hover{background:#AE1342}
.btn.blue{background:var(--navy-deep);color:var(--on)}
.btn.blue:hover{background:var(--navy)}
.btn.ghost{background:var(--sheet);color:var(--navy-deep);box-shadow:inset 0 0 0 1.5px var(--line-2)}
.btn.ghost:hover{box-shadow:inset 0 0 0 1.5px var(--navy-deep)}
.btn.wa{background:#167A4C;color:#fff}
.btn.sm{padding:6px 11px;font-size:.82rem;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default}
.linkbtn{border:0;background:none;color:var(--navy);font-weight:700;cursor:pointer;padding:4px;font-size:.86rem}

/* ---------- surfaces ---------- */
.grid{display:grid;gap:var(--s4)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:var(--s3);margin-bottom:var(--s4)}
.kpis.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);flex-wrap:wrap;margin:var(--s2) 0 var(--s3)}
.kpi{background:var(--sheet);border-radius:var(--arch);padding:16px 16px 14px;border:1px solid var(--line);display:flex;flex-direction:column;gap:3px;min-width:0;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;top:0;inset-inline:18px;height:2px;background:var(--thread);opacity:.8}
.kpi small{color:var(--muted);font-weight:600;font-size:var(--t-sm)}
.kpi b{font-family:var(--f);font-size:var(--t-num);font-weight:700;color:var(--navy-deep);font-variant-numeric:tabular-nums;line-height:1.25;letter-spacing:-.01em}
.kpi span{color:var(--muted);font-size:var(--t-xs)}
.kpi.red b{color:var(--crimson)}
.kpi.ok b{color:var(--ok)}
.panel{background:var(--sheet);border-radius:var(--r-lg);padding:var(--s5);border:1px solid var(--line);display:flex;flex-direction:column;gap:var(--s3);min-width:0}
.panel .ph{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.panel .ph h2{flex:1;min-width:0}
.cols2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--s4);align-items:start}
.cols3{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:var(--s4);align-items:start}

/* session cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--sheet);border-radius:var(--r);padding:14px;border:1px solid var(--line);display:flex;flex-direction:column;gap:10px;border-inline-start:4px solid var(--line);min-width:0}
.card.s-present{border-inline-start-color:var(--ok)}.card.s-late{border-inline-start-color:var(--late)}
.card.s-absent{border-inline-start-color:var(--miss)}.card.s-excused{border-inline-start-color:var(--exc)}
.card.s-tabsent{border-inline-start-color:var(--tab)}.card.s-resched{border-inline-start-color:var(--res)}
.card.is-next{box-shadow:0 0 0 2px var(--gold),var(--shadow-lift)}
.card .nexttag{align-self:flex-start;display:inline-flex;align-items:center;gap:5px;background:var(--gold);color:var(--navy-deep);font-size:.74rem;font-weight:700;border-radius:999px;padding:1px 10px;margin-bottom:-4px}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.who{min-width:0}
.who b{display:block;font-size:1.06rem;font-weight:700}
.who span,.sub{color:var(--muted);font-size:.84rem}
.time{text-align:end;white-space:nowrap}
.time b{display:block;color:var(--navy-deep);font-weight:700;font-size:1.08rem;font-variant-numeric:tabular-nums}
.time span{font-size:.74rem;color:var(--muted)}
.marks{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.mark{border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:9px 2px;font-weight:700;cursor:pointer;font-size:.86rem;color:var(--ink)}
.mark:hover:not(:disabled){border-color:var(--line-2);background:var(--sand)}
.mark[aria-pressed="true"]{color:#fff}
.mark[aria-pressed="true"].ok{background:var(--ok);border-color:var(--ok)}
.mark[aria-pressed="true"].late{background:var(--late);border-color:var(--late)}
.mark[aria-pressed="true"].miss{background:var(--miss);border-color:var(--miss)}
.mark[aria-pressed="true"].exc{background:var(--exc);border-color:var(--exc)}
.mark[aria-pressed="true"].tab{background:var(--tab);border-color:var(--tab)}
.mark[aria-pressed="true"].res{background:var(--res);border-color:var(--res)}
.mark:disabled{opacity:.55;cursor:default}
.actions{display:flex;flex-wrap:wrap;gap:6px}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 10px;font-size:.78rem;font-weight:600;background:var(--sky);color:var(--navy-deep);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.ok{background:#E3F2EC;color:#17704F}
.chip.warn,.chip.late{background:#F8EDD3;color:#7A5600}
.chip.miss{background:#FBE7ED;color:#A8123F}
.chip.exc{background:#ECEFF4;color:#4D5A73}
.chip.tab{background:var(--sky);color:var(--navy)}
.chip.res{background:#EFE8F8;color:#5B3F86}

.dots{display:flex;flex-wrap:wrap;gap:4px}
.dot{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:.7rem;font-weight:700;font-variant-numeric:tabular-nums;background:var(--sand);color:var(--muted)}
.dot.ok{background:var(--ok);color:#fff}.dot.late{background:var(--late);color:#fff}.dot.miss{background:var(--miss);color:#fff}.dot.exc{background:var(--exc);color:#fff}.dot.tab{background:var(--tab);color:#fff}.dot.res{background:var(--res);color:#fff}
.dot.none{background:none;border:1.5px dashed var(--miss);color:var(--miss)}
.meter{height:8px;border-radius:99px;background:var(--sand);overflow:hidden}
.meter i{display:block;height:100%;background:var(--navy-deep);border-radius:99px}
.meter.gold i{background:var(--gold)} .meter.ok i{background:var(--ok)}

.tscroll{overflow-x:auto;border-radius:12px;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:.88rem;background:var(--sheet)}
th,td{padding:11px 14px;text-align:start;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#FDFBF7}
th{font-size:.76rem;color:var(--navy-deep);font-weight:700;background:var(--sand);white-space:nowrap}
td.num,th.num{font-variant-numeric:tabular-nums;text-align:end;white-space:nowrap}
tr.total td{font-weight:700;color:var(--navy-deep);background:var(--sand)}
.pc{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.pc .meter{display:block;width:56px;height:6px}

.alerts{display:flex;flex-direction:column;gap:var(--s2)}
.alert{display:flex;gap:var(--s3);align-items:center;padding:10px var(--s3);border-radius:12px;background:var(--sheet);font-size:var(--t-md);border:1px solid var(--line);border-inline-start:3px solid var(--line-2)}
.alert>span{display:flex;flex-direction:column;gap:2px}
.grp{font-size:var(--t-xs);font-weight:700;color:var(--gold-ink);margin:var(--s1) 0 calc(-1 * var(--s1))}
.grp.red{color:var(--crimson)}
.alert b{color:var(--navy-deep)}
.alert.red{border-inline-start-color:var(--crimson)}
.alert.amber{border-inline-start-color:var(--gold)}
.alert.ok{border-inline-start-color:var(--ok)}
.alert>span{flex:1;min-width:0}
.alert .go{flex:none;align-self:center}
.empty.sm{padding:var(--s4) var(--s3);font-size:var(--t-md)}
.empty{text-align:center;color:var(--muted);padding:26px 12px;background:var(--sheet);border-radius:16px;border:1.5px dashed var(--line-2)}
.note{color:var(--muted);font-size:.83rem;margin:0}
.rep{border-radius:12px;background:var(--paper);padding:10px 12px;font-size:.88rem;display:flex;flex-direction:column;gap:2px;border:1px solid var(--line)}
.rep b{color:var(--navy-deep)}

/* money: the figure, then a small unit; numbers keep one baseline in every column */
.amt{display:inline-flex;align-items:baseline;gap:4px;font-variant-numeric:tabular-nums;white-space:nowrap}
.amt small{font-size:.66em;font-weight:500;color:var(--muted)}
.flow .step span.amt,.kpi span.amt,.fin span.amt{font-size:inherit;color:inherit}
.nowrap{white-space:nowrap}
.step.net .amt small,.today .amt small{color:#C9D3F0}
td.strong{font-weight:700;color:var(--navy-deep)}
td.neg,.neg{color:var(--crimson)} .pos{color:#17704F}
td.nowrap{white-space:nowrap}
.rowacts{display:flex;gap:6px;flex-wrap:nowrap;justify-content:flex-end}
table.money td{padding-block:12px}
.check{display:inline-flex;gap:var(--s2);align-items:center;font-size:var(--t-sm);color:var(--muted);cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--navy-deep)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font:inherit;font-size:var(--t-sm);font-weight:600;border:1.5px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.seg button b{font-variant-numeric:tabular-nums;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--navy-deep);border-color:var(--navy-deep);color:#fff}
.seg button[aria-pressed="true"] b{color:var(--gold)}
.btn .cnt{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--crimson);color:#fff;font-size:var(--t-xs);font-weight:700}
/* loading, error */
.state{display:flex;flex-direction:column;align-items:center;gap:var(--s2);text-align:center;color:var(--muted);padding:48px var(--s4);background:var(--sheet);border:1px solid var(--line);border-radius:var(--r-lg);max-width:520px;margin:6vh auto 0}
.state b{color:var(--navy-deep);font-family:var(--fh);font-size:var(--t-lg)}
.state.error{border-top:3px solid var(--crimson)}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--sand);border-top-color:var(--gold);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none;border-top-color:var(--navy-deep)}*{transition:none!important}}

/* ---------- dashboard parts ---------- */
.hello{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;margin-bottom:16px}
.hello .grow{flex:1;min-width:220px}
.hello h1{margin-top:2px}
.quick{display:flex;flex-wrap:wrap;gap:8px}
.today{display:grid;grid-template-columns:auto repeat(4,1fr) auto;align-items:center;gap:0;background:var(--navy-deep);color:#fff;border-radius:var(--r-lg);padding:6px;margin-bottom:16px;position:relative;overflow:hidden}
.today::after{content:"";position:absolute;inset-inline:24px;bottom:0;height:2px;background:var(--thread);opacity:.7}
.today .lbl{padding:10px 18px;display:flex;flex-direction:column;gap:0;border-inline-end:1px solid rgba(255,255,255,.14)}
.today .lbl b{font-family:var(--fh);font-size:1.1rem}
.today .lbl span{color:#C9D3F0;font-size:.78rem}
.today .st{padding:8px 18px;display:flex;flex-direction:column;border-inline-end:1px solid rgba(255,255,255,.1)}
.today .st b{font-size:var(--t-num);font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.today .st span{color:#C9D3F0;font-size:.78rem}
.today .st.hot b{color:#FFB3C8}
.today .btn{margin-inline:10px;background:#fff;color:var(--navy-deep)}
.side{display:flex;flex-direction:column;gap:14px}
.fin{display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:2px var(--s3);padding:var(--s3) 0;border-bottom:1px solid var(--line)}
.fin:last-of-type{border-bottom:0;padding-bottom:0}
.fin-l{display:flex;flex-direction:column;min-width:0}
.fin-l span{font-size:var(--t-md);color:var(--ink);font-weight:500}
.fin-l small{font-size:var(--t-xs);color:var(--muted)}
.fin b{font-size:var(--t-xl);font-weight:700;color:var(--navy-deep)}
.fin b.red{color:var(--crimson)} .fin b.ok{color:var(--ok)}
.fin .meter{grid-column:1/-1;margin-top:var(--s1)}
.stat{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.stat:last-child{border-bottom:0;padding-bottom:0}
.stat small{color:var(--muted);font-size:.84rem;font-weight:500}
.stat small em{display:block;font-style:normal;font-size:.74rem;color:var(--muted);opacity:.85}
.stat b{font-size:1.25rem;font-weight:700;color:var(--navy-deep);font-variant-numeric:tabular-nums;white-space:nowrap}
.stat b.red{color:var(--crimson)} .stat b.ok{color:var(--ok)}
.stat .meter{margin-top:6px}

/* accounts: the money flow */
.flow{display:grid;grid-template-columns:1fr auto 1fr auto 1fr auto 1fr auto 1.1fr;align-items:stretch;gap:8px;margin-bottom:18px}
.flow .step{background:var(--sheet);border:1px solid var(--line);border-radius:var(--arch);padding:14px 16px;display:flex;flex-direction:column;gap:3px;min-width:0;position:relative;overflow:hidden}
.flow .step .meter{margin-top:6px}
.flow .step::before{content:"";position:absolute;top:0;inset-inline:18px;height:2px;background:var(--thread);opacity:.8}
.flow .step small{color:var(--muted);font-size:.8rem;font-weight:600;display:flex;align-items:center;gap:6px}
.flow .step b{font-size:var(--t-xl);font-weight:700;color:var(--navy-deep);font-variant-numeric:tabular-nums;line-height:1.25}
.flow .step span{color:var(--muted);font-size:.76rem}
.flow .step.net{background:var(--navy-deep);border-color:var(--navy-deep)}
.flow .step.net small,.flow .step.net span{color:#C9D3F0}
.flow .step.net b{color:#fff}
.flow .step.net.neg b{color:#FFB3C8}
.flow .op{display:grid;place-items:center;color:var(--gold-ink);font-weight:700;font-size:1.2rem}

/* teacher (phone first) */
.daybar{position:sticky;top:var(--topH,108px);z-index:4;background:color-mix(in srgb,var(--paper) 94%,transparent);backdrop-filter:blur(8px);margin-inline:-16px;padding:8px 16px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.prog{display:flex;align-items:center;gap:12px;background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:12px}
.prog .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.prog b{font-variant-numeric:tabular-nums}

/* parent */
.kid{gap:14px}
.kidhead{display:flex;align-items:center;gap:12px}
.kidhead .av{width:46px;height:46px;border-radius:50%;background:var(--sand);color:var(--navy-deep);display:grid;place-items:center;font-family:var(--fh);font-weight:800;font-size:1.2rem;box-shadow:0 0 0 2px var(--gold)}
.nextup{background:var(--navy-deep);color:#fff;border-radius:var(--arch);padding:16px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.nextup::after{content:"";position:absolute;inset-inline:20px;bottom:0;height:2px;background:var(--thread)}
.nextup small{color:#C9D3F0;font-size:.8rem}
.nextup b{font-size:2rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.nextup span{color:#E4E9F7;font-size:.86rem}
.nextup .btn{align-self:flex-start;margin-top:6px}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.trio div{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.trio b{display:block;font-size:1.3rem;font-weight:700;font-variant-numeric:tabular-nums;color:var(--navy-deep)}
.trio span{font-size:.76rem;color:var(--muted)}
.trio .ok b{color:var(--ok)} .trio .miss b{color:var(--miss)} .trio .exc b{color:var(--exc)}

/* ---------- forms & sheet ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:20;background:rgba(12,36,112,.4);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--sheet);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px));border-top:3px solid var(--gold)}
@media (min-width:700px){.sheet-wrap{align-items:center}.sheet{border-radius:22px}}
.sheet h2{margin-bottom:12px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;min-width:0}
.field label,.field .lab{font-weight:600;font-size:.86rem;color:var(--ink)}
.field small{color:var(--muted);font-size:.8rem}
input::file-selector-button{font:inherit;font-weight:700;border:0;border-radius:10px;background:var(--navy-deep);color:#fff;padding:6px 12px;margin-inline-end:10px;cursor:pointer}
input,select,textarea{background:var(--paper);border:1.5px solid var(--line);border-radius:var(--r-sm);padding:9px 12px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--navy-deep);background:#fff;outline:none;box-shadow:0 0 0 3px rgba(12,36,112,.1)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pills label{position:relative;cursor:pointer}
.pills input{position:absolute;opacity:0;width:1px;height:1px}
.pills span{display:block;padding:6px 13px;border-radius:999px;background:var(--sheet);border:1.5px solid var(--line);font-weight:600;font-size:.86rem}
.pills input:checked+span{background:var(--navy-deep);border-color:var(--navy-deep);color:#fff}
.pills input:focus-visible+span{outline:3px solid var(--crimson)}
.slot{display:grid;grid-template-columns:100px 1fr auto;gap:8px;align-items:center;margin-bottom:6px}
.slot .rv{font-size:.82rem;color:var(--muted);display:flex;gap:4px;align-items:center;white-space:nowrap}
.slot .rv input{width:auto}
.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px}
.err{color:var(--crimson);font-weight:600;font-size:.88rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));background:var(--navy-deep);color:#fff;padding:10px 18px;border-radius:12px;z-index:30;font-size:.9rem;max-width:92vw;box-shadow:0 0 0 1px var(--gold),var(--shadow-lift)}

/* ---------- sign in: arch head ---------- */
.login{max-width:420px;margin:6vh auto 0;background:var(--sheet);border-radius:28px;padding:0 24px 26px;border:1px solid var(--line);box-shadow:var(--shadow-lift);display:flex;flex-direction:column;gap:14px;text-align:center;overflow:hidden}
.login .arch{margin:0 -24px 4px;height:150px;background:var(--navy-deep);position:relative;display:grid;place-items:end center;padding-bottom:0}
.login .arch::before{content:"";position:absolute;inset:18px 34px -1px;border-radius:999px 999px 0 0;border:2px solid var(--gold);border-bottom:0;opacity:.85}
.login .arch::after{content:"";position:absolute;inset-inline:0;bottom:-1px;height:36px;background:var(--sheet);border-radius:28px 28px 0 0}
.login img{width:88px;height:88px;margin:0 auto;object-fit:cover;object-position:50% 30%;border-radius:50%;background:#fff;box-shadow:0 0 0 3px var(--gold);position:relative;z-index:1;transform:translateY(14px)}
.login h1{font-size:1.6rem;margin-top:12px}
.login .tag{color:var(--muted);font-size:.9rem;margin:-8px 0 2px}
.login .roles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.login .btn{padding-block:12px}
.or{color:var(--muted);font-size:.84rem;display:flex;align-items:center;gap:10px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}

/* ---------- touch & small screens ---------- */
@media (pointer:coarse){.btn.sm,.linkbtn,select,.tabs button,.seg button{min-height:40px}.btn.sm{padding-block:8px}.linkbtn{padding-inline:8px}.nav button{width:40px;height:40px}.mark{min-height:48px}}
@media (max-width:1020px){.today{grid-template-columns:repeat(4,1fr)}.today .lbl{grid-column:1/-1;border:0;flex-direction:row;gap:10px;align-items:baseline}.today .btn{grid-column:1/-1;margin:6px}
  .flow{grid-template-columns:1fr 1fr}.flow .op{display:none}}
@media (max-width:1100px){.kpis.k4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){.cols2,.cols3{grid-template-columns:1fr}}
@media (max-width:700px){
  /* roles with a few tabs get a thumb-reach bottom bar */
  body.fewtabs .tabsbar{position:fixed;inset-inline:0;bottom:0;top:auto;z-index:6;border-top:1px solid var(--line);border-bottom:0;padding-bottom:env(safe-area-inset-bottom,0px);background:color-mix(in srgb,var(--sheet) 96%,transparent)}
  body.fewtabs .tabs{justify-content:space-around}
  body.fewtabs .tabs button{flex:1;flex-direction:column;gap:2px;padding:8px 6px 9px;font-size:.76rem}
  body.fewtabs .tabs button .ic{width:22px;height:22px}
  body.fewtabs .tabs button[aria-selected="true"]::after{top:-1px;bottom:auto}
  body.fewtabs main{padding-bottom:110px}
  .today{grid-template-columns:1fr 1fr}.today .st{border-inline-end:0;padding:8px 14px}
  h1{font-size:1.35rem}
}
@media (max-width:380px){.kpis.k4{grid-template-columns:1fr}.kpi b{font-size:var(--t-xl)}}
@media (max-width:520px){.chip{white-space:normal;max-width:100%}.card .actions .btn{flex:1 1 calc(50% - 6px)}.card .actions .btn.blue{flex-basis:100%}.today .btn{grid-column:1/-1}
  .two,.three{grid-template-columns:1fr}.me span{display:none}.nav span{min-width:110px}.login .roles{grid-template-columns:1fr}.flow{grid-template-columns:1fr}.logo small{display:none}}
</style>
</head>
